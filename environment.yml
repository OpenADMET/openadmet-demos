name: openadmet-demos
channels:
  - conda-forge
dependencies:
  - ase
  - boto3
  - catboost
  # chemprop >=2.3 hard-requires cuik_molmaker, whose compiled extension only links against
  # pip-wheel RDKit's bundled .dylibs, not conda-forge's rdkit (used below) - this breaks
  # chemprop's import on macOS/conda, so stay below that until the two are reconciled upstream
  - chemprop >=2.1.1,<2.3
  - datamol
  - e3nn
  - h5py
  - hyperopt
  - intake
  - intake-parquet
  - joblib
  - lightgbm
  - loguru
  - matplotlib
  - medchem
  - mordredcommunity
  - numpy >=2
  - openff-units
  - pandas
  - pip
  - python >= 3.12
  - pytorch
  - pytorch-lightning <=2.6.1
  - pytorch_cluster
  - pytorch_geometric
  - pytorch_scatter
  - pytorch_sparse
  - pytest
  - rdkit
  - rich
  - scikit-learn
  - seaborn
  - splito
  # - tabpfn
  - umap-learn
  - uncertainty-toolbox
  - xgboost
  - zarr >=3.0.0
  - pip:
    - chembl-downloader
    - email-validator
    - git+https://github.com/OpenADMET/mtenn.git@main
    - tabpfn-extensions
    # openadmet-models pins its own exact commits for molfeat, TabPFN, neural-pairwise-regression
    # (nepare), and useful_rdkit_utils; listing a separate @main/@master ref here creates two
    # conflicting requirements for the same package name and pip's resolver fails
    - git+https://github.com/OpenADMET/openadmet-models.git@main
    - git+https://github.com/OpenADMET/openadmet-toolkit.git@main
    - mols2grid
    - setuptools <82.0.0
    - lightning <=2.6.1
    - wandb <0.26.0
